<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Firebase Realtime</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; margin-top: 10px; cursor: pointer; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; transition: 0.3s; }
        #addBtn { background-color: #FFA000; } /* Цвет Firebase */
        #addBtn:hover { background-color: #e68a00; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li { background: #f9f9f9; margin: 8px 0; padding: 15px; border-left: 5px solid #FFA000; border-radius: 4px; display: flex; justify-content: space-between; animation: fadeIn 0.5s; }
        
        .status { 
            margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; 
            background-color: #e6fffa; color: #00b894; display: none; 
        }
        .status.show { display: block; }
        
        .realtime-indicator { display: flex; align-items: center; justify-content: center; margin-top: 15px; font-weight: bold; color: #888; }
        .dot { height: 10px; width: 10px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-right: 8px; transition: 0.3s; }
        .dot.active { background-color: #FFA000; box-shadow: 0 0 8px #FFA000; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h2>Firebase Realtime</h2>
    
    <input type="text" id="loginInput" placeholder="Логин (username)" autocomplete="off">
    <input type="password" id="passInput" placeholder="Пароль (password)" autocomplete="off">
    <button id="addBtn">Добавить (Insert)</button>

    <div class="realtime-indicator">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Подключение к Realtime...</span>
    </div>

    <h3>Список из базы (Realtime):</h3>
    <ul id="usersList">
        <li style="border-left-color: #ccc; color: #888; justify-content: center;">Загрузка...</li>
    </ul>
</div>

<!-- Подключаем SDK Firebase (Модули) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    // Добавляем onSnapshot для Realtime
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ==========================================
    // ВАШИ КЛЮЧИ FIREBASE
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyCn3hMLqRXxG5xNTHFJEyxodw-ItvQ7UT0",
        authDomain: "iulssef.firebaseapp.com",
        projectId: "iulssef",
        storageBucket: "iulssef.firebasestorage.app",
        messagingSenderId: "951816826880",
        appId: "1:951816826880:web:91ce91394ea110b97468e5",
        measurementId: "G-YRNWRM5G9K"
    };

    // Инициализация Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const usersCollection = collection(db, "Users");

    const list = document.getElementById('usersList');
    const dot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    // --- ВСТАВКА (INSERT) ---
    document.getElementById('addBtn').addEventListener('click', async () => {
        const login = document.getElementById('loginInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();

        if (!login || !pass) { alert("Заполните логин и пароль!"); return; }

        document.getElementById('addBtn').disabled = true;

        try {
            await addDoc(usersCollection, {
                username: login,
                password: pass
            });
            document.getElementById('loginInput').value = '';
            document.getElementById('passInput').value = '';
            // Список обновится САМ благодаря onSnapshot, вызывать loadUsers не нужно
        } catch (e) {
            console.error("Ошибка вставки: ", e);
            alert("Ошибка: " + e.message);
        } finally {
            document.getElementById('addBtn').disabled = false;
        }
    });

    // --- REALTIME (Подписка на изменения) ---
    // Функция onSnapshot автоматически вызывается при каждом изменении в базе
    onSnapshot(usersCollection, (snapshot) => {
        // Включаем зеленый индикатор
        dot.classList.add('active');
        statusText.textContent = 'Realtime активен';
        statusText.style.color = '#FFA000';

        list.innerHTML = ''; // Очищаем старый список

        if (snapshot.empty) {
            list.innerHTML = '<li style="border-left-color: #ccc; color: #888; justify-content: center;">База данных пуста</li>';
            return;
        }

        // Перебираем все документы и выводим их
        snapshot.forEach((doc) => {
            const user = doc.data();
            const li = document.createElement('li');
            li.innerHTML = `<span><b>Логин:</b> ${user.username}</span><span>Пароль: ${user.password}</span>`;
            list.appendChild(li);
        });
    }, (error) => {
        // Если произошла ошибка подключения
        console.error("Ошибка Realtime: ", error);
        dot.classList.remove('active');
        statusText.textContent = 'Ошибка подключения';
        statusText.style.color = 'red';
    });
</script>
</body>
</html>
