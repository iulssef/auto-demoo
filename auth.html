<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Авторизация: Firebase и Supabase</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: 'Segoe UI', sans-serif; background:#f4f7f6; padding:20px; margin:0; }
  .wrap { max-width:560px; margin:0 auto; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { flex:1; padding:12px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; background:#ddd; }
  .tabs button.on.fb { background:#FFA000; color:#fff; }
  .tabs button.on.sb { background:#3ecf8e; color:#fff; }
  .card { background:#fff; padding:24px; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,.1); display:none; }
  .card.show { display:block; }
  h2 { text-align:center; margin-top:0; color:#333; }
  input { width:100%; padding:12px; margin:6px 0; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; font-size:16px; }
  .btn { width:100%; padding:12px; margin-top:8px; border:none; border-radius:6px; font-size:16px; font-weight:bold; cursor:pointer; color:#fff; background:#333; }
  .btn.g { background:#4285f4; } .btn.gh { background:#24292f; } .btn.out { background:#d63031; }
  .row { display:flex; gap:8px; } .row .btn { flex:1; }
  .msg { margin-top:10px; text-align:center; font-weight:bold; min-height:20px; }
  .err { color:#d63031; } .ok { color:#00b894; }
  ul { list-style:none; padding:0; }
  li { background:#f8f9fa; margin:8px 0; padding:12px 15px; border-radius:6px; border-left:5px solid #888; }
  .fbc li { border-left-color:#FFA000; } .sbc li { border-left-color:#3ecf8e; }
  .hide { display:none; }
  hr { border:none; border-top:1px solid #eee; margin:16px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs">
    <button id="tabFb" class="fb on">Firebase</button>
    <button id="tabSb" class="sb">Supabase</button>
  </div>

  <!-- ================= FIREBASE ================= -->
  <div id="fbCard" class="card fbc show">
    <h2>Firebase</h2>
    <div id="fbAuth">
      <input id="fbEmail" type="email" placeholder="Email">
      <input id="fbPass" type="password" placeholder="Пароль (минимум 6 символов)">
      <div class="row">
        <button class="btn" id="fbLogin">Войти</button>
        <button class="btn" id="fbReg">Регистрация</button>
      </div>
      <button class="btn g" id="fbGoogle">Войти через Google</button>
      <button class="btn gh" id="fbGithub">Войти через GitHub</button>
    </div>
    <div id="fbApp" class="hide">
      <p>Вы вошли как: <b id="fbName"></b></p>
      <input id="fbUser" placeholder="Новый пользователь (username)">
      <button class="btn" id="fbAdd">Добавить в базу</button>
      <h3>Список из базы (Realtime):</h3>
      <ul id="fbList"></ul>
      <button class="btn out" id="fbOut">Выйти</button>
    </div>
    <div id="fbMsg" class="msg"></div>
  </div>

  <!-- ================= SUPABASE ================= -->
  <div id="sbCard" class="card sbc">
    <h2>Supabase</h2>
    <div id="sbAuth">
      <input id="sbEmail" type="email" placeholder="Email">
      <input id="sbPass" type="password" placeholder="Пароль (минимум 6 символов)">
      <div class="row">
        <button class="btn" id="sbLogin">Войти</button>
        <button class="btn" id="sbReg">Регистрация</button>
      </div>
      <button class="btn g" id="sbGoogle">Войти через Google</button>
      <button class="btn gh" id="sbGithub">Войти через GitHub</button>
    </div>
    <div id="sbApp" class="hide">
      <p>Вы вошли как: <b id="sbName"></b></p>
      <input id="sbUser" placeholder="Новый пользователь (username)">
      <button class="btn" id="sbAdd">Добавить в базу</button>
      <h3>Список из базы:</h3>
      <ul id="sbList"></ul>
      <button class="btn out" id="sbOut">Выйти</button>
    </div>
    <div id="sbMsg" class="msg"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, signInWithPopup, GoogleAuthProvider, GithubAuthProvider,
         createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
function msg(id, text, bad) { const e = $(id); e.textContent = text; e.className = 'msg ' + (bad ? 'err' : 'ok'); }
function fill(ul, names) {
  ul.innerHTML = '';
  if (!names.length) { const li = document.createElement('li'); li.textContent = 'База данных пуста'; ul.appendChild(li); return; }
  names.forEach(n => { const li = document.createElement('li'); li.textContent = n; ul.appendChild(li); });
}

// ---------- Вкладки ----------
$('tabFb').onclick = () => { $('tabFb').classList.add('on'); $('tabSb').classList.remove('on'); $('fbCard').classList.add('show'); $('sbCard').classList.remove('show'); };
$('tabSb').onclick = () => { $('tabSb').classList.add('on'); $('tabFb').classList.remove('on'); $('sbCard').classList.add('show'); $('fbCard').classList.remove('show'); };

// ================= FIREBASE =================
const app = initializeApp({
  apiKey: "AIzaSyCn3hMLqRXxG5xNTHFJEyxodw-ItvQ7UT0",
  authDomain: "iulssef.firebaseapp.com",
  projectId: "iulssef",
  storageBucket: "iulssef.firebasestorage.app",
  messagingSenderId: "951816826880",
  appId: "1:951816826880:web:91ce91394ea110b97468e5"
});
const auth = getAuth(app);
const db = getFirestore(app);
const users = collection(db, "Users");
let unsub = null;

const fbErr = e => msg('fbMsg', e.code + ': ' + e.message, true);
$('fbLogin').onclick = () => signInWithEmailAndPassword(auth, $('fbEmail').value.trim(), $('fbPass').value).catch(fbErr);
$('fbReg').onclick = () => createUserWithEmailAndPassword(auth, $('fbEmail').value.trim(), $('fbPass').value).catch(fbErr);
$('fbGoogle').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(fbErr);
$('fbGithub').onclick = () => signInWithPopup(auth, new GithubAuthProvider()).catch(fbErr);
$('fbOut').onclick = () => signOut(auth);
$('fbAdd').onclick = async () => {
  const v = $('fbUser').value.trim();
  if (!v) return msg('fbMsg', 'Введите username', true);
  try { await addDoc(users, { username: v, uid: auth.currentUser.uid }); $('fbUser').value = ''; msg('fbMsg', 'Добавлено!'); }
  catch (e) { fbErr(e); }
};

onAuthStateChanged(auth, user => {
  if (user) {
    $('fbAuth').classList.add('hide'); $('fbApp').classList.remove('hide');
    $('fbName').textContent = user.displayName || user.email;
    unsub = onSnapshot(users,
      snap => fill($('fbList'), snap.docs.map(d => d.data().username || '(без имени)')),
      e => fbErr(e));
  } else {
    if (unsub) { unsub(); unsub = null; }
    $('fbApp').classList.add('hide'); $('fbAuth').classList.remove('hide');
  }
});

// ================= SUPABASE =================
const sb = window.supabase.createClient(
  'https://lixunmxyfsbojqtqzqjj.supabase.co',
  'sb_publishable_0pUMZd2glcjvHqTy8ydnQA_HxijFW-r'
);
const redirectTo = location.origin + location.pathname;
const sbErr = e => msg('sbMsg', e.message, true);

async function sbLoad() {
  const { data, error } = await sb.from('Users').select('*');
  if (error) return sbErr(error);
  fill($('sbList'), data.map(u => u.username || '(без имени)'));
}
function sbShow(session) {
  if (session) {
    $('sbAuth').classList.add('hide'); $('sbApp').classList.remove('hide');
    const u = session.user;
    $('sbName').textContent = (u.user_metadata && (u.user_metadata.full_name || u.user_metadata.user_name)) || u.email;
    sbLoad();
  } else {
    $('sbApp').classList.add('hide'); $('sbAuth').classList.remove('hide');
  }
}
$('sbLogin').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('sbEmail').value.trim(), password: $('sbPass').value });
  if (error) sbErr(error);
};
$('sbReg').onclick = async () => {
  const { data, error } = await sb.auth.signUp({ email: $('sbEmail').value.trim(), password: $('sbPass').value, options: { emailRedirectTo: redirectTo } });
  if (error) return sbErr(error);
  if (!data.session) msg('sbMsg', 'Проверьте почту и подтвердите email');
};
$('sbGoogle').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo } });
$('sbGithub').onclick = () => sb.auth.signInWithOAuth({ provider: 'github', options: { redirectTo } });
$('sbOut').onclick = () => sb.auth.signOut();
$('sbAdd').onclick = async () => {
  const v = $('sbUser').value.trim();
  if (!v) return msg('sbMsg', 'Введите username', true);
  const { error } = await sb.from('Users').insert([{ username: v }]);
  if (error) return sbErr(error);
  $('sbUser').value = ''; msg('sbMsg', 'Добавлено!'); sbLoad();
};
sb.auth.onAuthStateChange((_e, session) => sbShow(session));
sb.auth.getSession().then(({ data }) => sbShow(data.session));
</script>
</body>
</html>
