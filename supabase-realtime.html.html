<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Realtime</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #addBtn { background-color: #3ecf8e; color: white; }
        #addBtn:hover { background-color: #36b37e; }
        button:disabled { background-color: #ccc; }
        
        .realtime-indicator { 
            display: flex; align-items: center; justify-content: center; 
            margin-top: 15px; font-weight: bold; color: #888;
        }
        .dot { 
            height: 10px; width: 10px; background-color: #bbb; border-radius: 50%; 
            display: inline-block; margin-right: 8px; transition: 0.3s;
        }
        .dot.active { background-color: #3ecf8e; box-shadow: 0 0 8px #3ecf8e; }
        
        h3 { color: #333; margin-top: 25px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f8f9fa; margin: 8px 0; padding: 15px; border-radius: 6px; border-left: 5px solid #3ecf8e; display: flex; justify-content: space-between; animation: fadeIn 0.5s; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <h2>Realtime Supabase</h2>
        
        <input type="text" id="loginInput" placeholder="Логин (username)" autocomplete="off">
        <input type="password" id="passInput" placeholder="Пароль (password)" autocomplete="off">
        <button id="addBtn">Добавить (Insert)</button>

        <div class="realtime-indicator">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Подключение к Realtime...</span>
        </div>

        <h3>Список из базы (Realtime):</h3>
        <ul id="usersList">
            <li style="border-left-color: #ccc; color: #888; justify-content: center;">Загрузка...</li>
        </ul>
    </div>

    <script>
        // ==========================================
        // ВАШИ ДАННЫЕ
        // ==========================================
        const supabaseUrl = 'https://lixunmxyfsbojqtqzqjj.supabase.co'; 
        const supabaseKey = 'sb_publishable_0pUMZd2glcjvHqTy8ydnQA_HxijFW-r'; 

        const client = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Элементы интерфейса
        const list = document.getElementById('usersList');
        const dot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // ==========================================
        // 1. ВСТАВКА (INSERT)
        // ==========================================
        document.getElementById('addBtn').addEventListener('click', async () => {
            const login = document.getElementById('loginInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();

            if (!login || !pass) {
                alert("Заполните логин и пароль!");
                return;
            }

            document.getElementById('addBtn').disabled = true;

            const { error } = await client
                .from('Users') 
                .insert([{ username: login, password: pass }]);

            document.getElementById('addBtn').disabled = false;

            if (error) {
                alert('Ошибка: ' + error.message);
            } else {
                document.getElementById('loginInput').value = '';
                document.getElementById('passInput').value = '';
                // Список обновится САМ благодаря Realtime, вызывать loadUsers() не нужно
            }
        });

        // ==========================================
        // 2. ВЫВОД (SELECT)
        // ==========================================
        async function loadUsers() {
            const { data, error } = await client.from('Users').select('*');
            
            if (error) {
                list.innerHTML = `<li style="border-left-color: red; color: red;">Ошибка загрузки</li>`;
                return;
            }

            list.innerHTML = ''; 
            if (data && data.length > 0) {
                data.forEach(user => renderUser(user));
            } else {
                list.innerHTML = '<li style="border-left-color: #ccc; color: #888; justify-content: center;">База данных пуста</li>';
            }
        }

        // Функция для отрисовки одного пользователя
        function renderUser(user) {
            // Удаляем заглушку "База пуста", если она есть
            if (list.innerHTML.includes('База данных пуста') || list.innerHTML.includes('Загрузка...')) {
                list.innerHTML = '';
            }

            const li = document.createElement('li');
            li.id = `user-${user.id}`; // Присваиваем ID для удаления/обновления
            li.innerHTML = `
                <span><b>Логин:</b> ${user.username}</span>
                <span style="color: #555;">Пароль: ${user.password}</span>
            `;
            list.appendChild(li);
        }

        // ==========================================
        // 3. REALTIME (Подписка на изменения)
        // ==========================================
        function setupRealtime() {
            client
                .channel('schema-db-changes') // Создаем канал
                .on(
                    'postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'Users' }, // Слушаем только вставки
                    (payload) => {
                        console.log('Новая запись в Realtime:', payload.new);
                        renderUser(payload.new); // Добавляем в список
                    }
                )
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        dot.classList.add('active');
                        statusText.textContent = 'Realtime активен';
                        statusText.style.color = '#3ecf8e';
                    } else {
                        dot.classList.remove('active');
                        statusText.textContent = 'Ожидание...';
                        statusText.style.color = '#888';
                    }
                });
        }

        // Запуск
        window.addEventListener('DOMContentLoaded', () => {
            loadUsers();      // Сначала загружаем то, что уже есть
            setupRealtime();  // Затем включаем "прямой эфир"
        });
    </script>
</body>
</html>
